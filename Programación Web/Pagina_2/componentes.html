<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componentes</title>
</head>
<body>
    <label>Nombre: </label>
    <input type="text" id="nombre">
    <label>Telefono: </label>
    <input type="tel" pattern="[0-9]{2}-[0-9]{4}-[0-9]{4}" id="telefono" placeholder="55-1234-5678" maxlength="10" minlength="10">
    <label>Calendario</label>
    <input type="datetime-local" max="2026-12-31T23:59" min="2025-01-31T00:01">
</body>
</html>
